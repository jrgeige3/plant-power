<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protein Tracker</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1f2421;--muted:#6b726d;--accent:#2f7d5b;--track:#e4e8e5;--border:#e0e3df;--danger:#b4412f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1e2421;--text:#eef1ee;--muted:#9aa39d;--accent:#5fc796;--track:#2c3430;--border:#2f3833;--danger:#e8806e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141816;--card:#1e2421;--text:#eef1ee;--muted:#9aa39d;--accent:#5fc796;--track:#2c3430;--border:#2f3833;--danger:#e8806e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.big{font-size:40px;font-weight:700}
.muted{color:var(--muted);font-size:14px}
.bar{height:12px;background:var(--track);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>div{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;min-width:0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:10px 12px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.chip{padding:8px 12px;font-size:14px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.item:first-child{border-top:0}
.x{background:none;border:0;color:var(--danger);padding:4px 8px}
.hist{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:10px}
.hist div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.hist span{display:block;background:var(--track);border-radius:4px 4px 0 0;margin-bottom:4px}
.hist .on span{background:var(--accent)}
.day{display:flex;align-items:center;justify-content:space-between;gap:8px}
</style>
</head>
<body>
<main>
  <h1>Protein Tracker</h1>

  <div class="card">
    <div class="day">
      <button id="prev" aria-label="Previous day">&larr;</button>
      <strong id="dayLabel"></strong>
      <button id="next" aria-label="Next day">&rarr;</button>
    </div>
    <div style="text-align:center;margin-top:12px"><span class="big" id="total">0</span><span class="muted"> / <span id="goalTxt">120</span> g</span></div>
    <div class="bar"><div id="fill" style="width:0"></div></div>
    <div class="muted" id="remain"></div>
  </div>

  <div class="card">
    <strong>Add food</strong>
    <div class="row">
      <input id="name" placeholder="Food (optional)" style="flex:2">
      <input id="grams" type="number" inputmode="decimal" min="0" placeholder="g protein" style="flex:1">
      <button class="primary" id="add">Add</button>
    </div>
  </div>

  <div class="card">
    <strong>My foods</strong>
    <div class="muted">Save foods you eat often, then log them in one tap.</div>
    <div class="row">
      <input id="fname" placeholder="Food name" style="flex:2">
      <input id="fgrams" type="number" inputmode="decimal" min="0" placeholder="g protein" style="flex:1">
      <button id="saveFood">Save</button>
    </div>
    <div id="foods"></div>
  </div>

  <div class="card">
    <strong>Entries</strong>
    <div id="list"></div>
  </div>

  <div class="card">
    <strong>Last 7 days</strong>
    <div class="hist" id="hist"></div>
  </div>

  <div class="card">
    <strong>Daily goal</strong>
    <div class="row">
      <input id="goal" type="number" inputmode="numeric" min="1" style="width:100px">
      <button id="saveGoal">Save</button>
    </div>
    <p class="muted" style="margin:10px 0 0">Saved on this device in your browser.</p>
  </div>
</main>

<script>
let S={goal:120,days:{},foods:[]};
try{const r=localStorage.getItem("protein-tracker");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("protein-tracker",JSON.stringify(S))}catch(e){}};
const key=d=>{const o=new Date(d.getTime()-d.getTimezoneOffset()*60000);return o.toISOString().slice(0,10)};
let cur=new Date();
const $=id=>document.getElementById(id);
const entries=(d)=>S.days[key(d)]||[];
const sum=d=>entries(d).reduce((a,e)=>a+e.g,0);
function addEntry(name,g){
  g=parseFloat(g);if(!(g>0))return;
  const k=key(cur);(S.days[k]=S.days[k]||[]).push({name:name||"Protein",g});
  save();render();
}
function renderFoods(){
  const L=$("foods");L.innerHTML="";
  if(!S.foods.length){L.innerHTML='<div class="muted" style="margin-top:8px">No saved foods yet.</div>';return}
  S.foods.forEach((f,i)=>{
    const d=document.createElement("div");d.className="item";
    const a=document.createElement("span");a.textContent=f.name+" \u00b7 "+f.g+" g";
    const b=document.createElement("span");
    const l=document.createElement("button");l.textContent="Log";l.onclick=()=>addEntry(f.name,f.g);
    const x=document.createElement("button");x.className="x";x.textContent="\u2715";x.setAttribute("aria-label","Delete saved food");
    x.onclick=()=>{S.foods.splice(i,1);save();render()};
    b.append(l,x);d.append(a,b);L.appendChild(d);
  });
}
function render(){
  renderFoods();
  const today=key(new Date())===key(cur);
  $("dayLabel").textContent=today?"Today":cur.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  $("next").disabled=today;
  const t=Math.round(sum(cur)*10)/10;
  $("total").textContent=t;$("goalTxt").textContent=S.goal;
  $("fill").style.width=Math.min(100,t/S.goal*100)+"%";
  $("remain").textContent=t>=S.goal?"Goal reached \u2014 "+Math.round((t-S.goal)*10)/10+" g over":Math.round((S.goal-t)*10)/10+" g to go";
  const L=$("list");L.innerHTML="";
  const es=entries(cur);
  if(!es.length){L.innerHTML='<div class="muted" style="margin-top:8px">Nothing logged yet.</div>'}
  es.forEach((e,i)=>{
    const d=document.createElement("div");d.className="item";
    const a=document.createElement("span");a.textContent=e.name;
    const b=document.createElement("span");b.textContent=e.g+" g ";
    const x=document.createElement("button");x.className="x";x.textContent="\u2715";x.setAttribute("aria-label","Delete");
    x.onclick=()=>{es.splice(i,1);save();render()};
    b.appendChild(x);d.append(a,b);L.appendChild(d);
  });
  const H=$("hist");H.innerHTML="";
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const v=sum(d),h=Math.max(2,Math.min(70,v/S.goal*70));
    const c=document.createElement("div");if(v>=S.goal)c.className="on";
    c.innerHTML='<span style="height:'+h+'px"></span>'+Math.round(v)+'<br>'+d.toLocaleDateString(undefined,{weekday:"narrow"});
    H.appendChild(c);
  }
}
$("add").onclick=()=>{addEntry($("name").value.trim(),$("grams").value);$("name").value="";$("grams").value=""};
$("grams").addEventListener("keydown",e=>{if(e.key==="Enter")$("add").click()});
$("saveFood").onclick=()=>{
  const n=$("fname").value.trim(),g=parseFloat($("fgrams").value);
  if(!n||!(g>0))return;
  const ex=S.foods.find(f=>f.name.toLowerCase()===n.toLowerCase());
  if(ex)ex.g=g;else S.foods.push({name:n,g});
  $("fname").value="";$("fgrams").value="";
  save();render();
};
$("prev").onclick=()=>{cur.setDate(cur.getDate()-1);render()};
$("next").onclick=()=>{cur.setDate(cur.getDate()+1);render()};
$("goal").value=S.goal;
$("saveGoal").onclick=()=>{const v=parseFloat($("goal").value);if(v>0){S.goal=v;save();render()}};
render();
</script>
</body>
</html>
